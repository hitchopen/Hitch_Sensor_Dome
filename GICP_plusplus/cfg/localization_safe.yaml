/**:
  ros__parameters:

    # ==========================================================================
    # Safe-mode overlay for gicp_localization
    #
    # Layer this AFTER cfg/localization.yaml in the launch file's --params-file
    # chain (ros2 launch's `mode:=safe` does this automatically). Each entry
    # below intentionally overrides the race-mode default to reclaim sensor
    # coverage, registration robustness, and operator diagnostic visibility
    # at the cost of CPU time.
    #
    # Choose safe mode when:
    #   - The vehicle operates at parking / pedestrian / urban speeds where
    #     rear-quadrant features materially help GICP.
    #   - The map is sparse to the front, or has long feature-poor stretches
    #     that benefit from 360° coverage.
    #   - You're debugging an alignment issue and want every debug topic on.
    #   - The localizer is doing not-strictly-localization work (live obstacle
    #     accumulation, 360° awareness) that needs all three LiDARs.
    #   - The host PC has CPU headroom and latency is not the bottleneck.
    #
    # Choose race mode (no overlay) when:
    #   - The vehicle is operating at race speed on a feature-rich pre-built
    #     map.
    #   - You need the tightest possible IMU-to-pose and scan-to-correction
    #     latency.
    #   - The control loop consumes pose at 200 Hz+ and can't tolerate
    #     scan-rate jitter.
    #
    # Every override below carries a one-line comment explaining the trade.
    # ==========================================================================

    # --- Multi-LiDAR concatenation (full 360° coverage) ---
    # Brings the two rear Robin Ws back into the localizer's input. Roughly
    # 2-3× more points per scan, ~50 ms of aux-buffering jitter, ~3× GICP
    # alignment cost. The tradeoff is worth it when feature-poor front
    # stretches benefit from rear-quadrant returns.
    localization/lidar_concat/enabled: true
    localization/lidar_concat/require_all_aux: true
    localization/lidar_concat/future_sweep_wait_timeout: 0.15

    # --- Preprocessing (full Robin W sensing range) ---
    # 100 m crop matches Robin W's effective range at moderate reflectivity.
    # The datasheet rates the sensor at 150 m max range / 70 m @ 90% POD;
    # 100 m keeps useful far-field points without including the high-noise
    # ring at the absolute edge. Raise to 150.0 if you want the absolute
    # maximum range (more far-field noise, more dust phantoms).
    dlio/preprocessing/cropBoxFilter/size: 100.0
    # Tighter voxel resolution for safe mode: more correspondences per
    # scan, better convergence quality in cluttered scenes. ~2.4× more
    # post-voxel points than race mode's 0.5 m.
    dlio/preprocessing/voxelFilter/res: 0.3

    # --- GICP registration (upstream-strict convergence) ---
    # Restore the upstream safety margin on iteration count and tighten
    # convergence thresholds. On feature-poor terrain GICP can need
    # 50-100 iterations to converge cleanly; race mode caps it at 32 to
    # bound per-scan latency. Safe mode lets GICP take whatever time it
    # needs to reach a tighter solution.
    gicp/maxIterations: 128
    gicp/transformationEpsilon: 0.001
    gicp/rotationEpsilon: 0.001
    # More NN samples → more stable per-point covariances → more robust
    # alignment in noisy / mixed-density scenes. Race uses 20.
    gicp/correspondenceRandomness: 30

    # --- Yaw-rate gain attenuation (DISABLED in safe mode) ---
    # Safe mode trusts GICP at all yaw rates. The attenuation in race
    # mode reduces Kp/Kq during corner entries to bias toward IMU
    # prediction; on a slower, controlled vehicle there's no benefit to
    # de-weighting the scan corrections, and disabling the attenuation
    # gives the geometric observer full authority to drive bias
    # estimation from every scan.
    odom/geo/yawrate_attenuation/enable: false

    # --- Stationary IMU calibration (tighter motion gate) ---
    # Race mode tolerates 0.10 m/s² accel-norm variance during the
    # stationary IMU calibration window — generous enough to avoid
    # rejecting normal idle vibration. Safe mode tightens to 0.05 m/s²
    # because a slower vehicle should be able to come to a complete stop
    # before logging starts, and we want a higher-quality bias estimate.
    localization/calib/motion_sigma_max: 0.05

    # --- GT-snap recovery (more aggressive — single failure triggers) ---
    # Race mode sets min_consecutive_failures=5 to avoid snapping on
    # transient corner rejections at high yaw rate. Safe mode reverts to
    # the upstream default of 1: snap immediately on the first GICP
    # rejection so the localizer never lingers in dead-reckoning.
    localization/gt_recovery/min_consecutive_failures: 1
    localization/gt_recovery/sanity_radius: 10.0

    # --- Debug / diagnostics ON ---
    # Safe mode is also "debugging-friendly mode" — every per-scan
    # diagnostic publisher and verbose log is on, so an operator
    # investigating an alignment issue gets the full picture without
    # restarting the node.
    localization/verbose: true
    localization/debug/enable_pub: true
    localization/debug/enable_jump_log: true
    localization/debug/verbose_scan_log: true

    # --- Map visualization (kept on; the cost is negligible) ---
    # The map visualization republish runs at 1 Hz with a separate
    # voxel filter. Cost is in the noise even in race mode; mentioning
    # here just for completeness — set to false if RViz is never connected.
    localization/visualize_map: true

    # Keep the bounded target algorithm active in safe mode as well. Its
    # synchronous fallback preserves LiDAR localization if a background crop
    # is late; RTK-fixed recovery remains governed by the existing GT gate.
    localization/local_map/enabled: true
    localization/local_map/radius: 150.0
    localization/local_map/min_points: 1000
    localization/local_map/build_threads: 1
