/**:
  ros__parameters:

    use_sim_time: true

    # ==========================================================================
    # gicp_localization for Hitch Sensor Dome
    #
    # Pure scan-to-map localizer against a pre-built PCD produced by
    # GLIM_plusplus offline mapping. Runs the IMU integrator + geometric
    # observer between scans and falls back to IMU dead-reckoning on
    # GICP rejections, with RTK-snap recovery from the Atlas Duo INS
    # odometry when GICP fails for too many consecutive scans.
    # ==========================================================================

    # --- Map ---
    # Path to the PCD map produced by GLIM_plusplus offline mapping.
    # The canonical exporter writes <map>.manifest.yaml beside it.
    localization/map_path: "maps/session_latest/map.pcd"
    localization/map_manifest_path: ""  # empty = <map_path>.manifest.yaml
    localization/require_map_manifest: true
    # Optional launch assertion. The live adapter also publishes its resolved
    # datum on /gps_p1/local_enu_origin for an independent runtime check.
    localization/expected_enu_origin: ""
    localization/require_live_enu_origin: true
    localization/enu_origin_tolerance_m: 0.25
    # Canonical maps are already ENU. Never reapply T_world_utm here.
    localization/utm_transform_path: ""
    localization/utm_frame: "utm"

    # --- Frame IDs (match sensor_dome_tf.yaml / sensor_dome.urdf) ---
    #
    # The map (built by GLIM_plusplus) is anchored at imu_link — the
    # Atlas Duo Center of Navigation. Localization output is reported
    # in base_link — the standard ROS body frame for downstream
    # consumers (controllers, planners, rviz). The static
    # imu_link → base_link transform in sensor_dome_tf.yaml is what
    # bridges the two; by default it's identity (base_link physically
    # coincident with imu_link). Override the YAML entry to put
    # base_link wherever vehicle convention says (rear axle, chassis
    # center, etc.) — the map stays valid because it's still
    # anchored at imu_link.
    localization/map_frame: "map"
    localization/base_frame: "base_link"          # Vehicle body frame (overridable)
    localization/imu_frame: "imu_link"            # Atlas Duo CoN — fixed by hardware
    localization/lidar_frame: "lidar_front_link"  # Primary Robin W (front)

    # NOTE: localization/voxel_leaf_size was a dead key (declared nowhere in
    # the code) and has been removed. Map downsampling is governed by
    # localization/map_voxel_size below; live-scan downsampling by
    # dlio/odom/preprocessing/voxelFilter/*.

    # Legacy unmanifested-map rotation. A canonical manifested ENU map rejects
    # nonzero overrides because they would invalidate its frame contract.
    localization/map_rotation/roll_deg: 0.0
    localization/map_rotation/pitch_deg: 0.0
    localization/map_rotation/yaw_deg: 0.0

    # GICP target-map downsampling. The map is voxel-downsampled (in place) at
    # load, BEFORE the kd-tree is built. A dense map (e.g. a ~49M-point GLIM
    # export) otherwise builds a multi-GB kd-tree that exhausts RAM/swap and
    # stalls registration for seconds. ~0.3 m cuts point count / memory ~10x with
    # negligible accuracy loss at the scan voxel (dlio/preprocessing/voxelFilter/res
    # below, 0.5 m). Set to 0.0 to disable and register against the full-res map.
    localization/map_voxel_size: 0.3

    # Bound each small_gicp registration target around the predicted pose.
    # The full GLIM map is downsampled and assigned covariances once at startup;
    # local crops reuse those covariances and build only a small KD-tree.
    # radius must exceed sqrt(2)*cropBoxFilter/size + max correspondence range.
    localization/local_map/enabled: true
    localization/local_map/radius: 150.0
    localization/local_map/min_points: 1000
    # Background KD-tree builds intentionally use one thread so live GICP keeps
    # the remaining CPU budget. A missed deadline falls back to a synchronous
    # local rebuild, never to a non-RTK GNSS reset.
    localization/local_map/build_threads: 1

    # Map visualization (separate, coarser downsample used only for RViz publishing)
    localization/visualize_map: true
    localization/map_voxel_size_vis: 1.5  # Downsample for RViz (increase for faster rendering)

    # TF publishing
    localization/publish_tf: false
    # If true, disable GICP scan matching and propagate pose using IMU /
    # geometric observer only. Debug / sanity check mode.
    localization/imu_only: false

    # Logging verbosity. true = INFO + raw stderr debug prints.
    # false = silence INFO/DEBUG; WARN/ERROR still pass through.
    localization/verbose: false

    # Use odometry for pose initialization. If true, waits for the first
    # odometry message; if false, waits for RViz "2D Pose Estimate".
    localization/use_odom_init: true

    # --- Atlas Duo INS cross-check + recovery ---
    # When enabled, the node subscribes to the `gt_odom` remap (default
    # /gps_p1/filtered_odom_rtk_fixed from the adapter) and reports
    # gt_err=[trans, rot, dt] in
    # every SCAN DEBUG line and publishes the deltas on
    # gicp/localization/debug/gt_pos_err_m and .../gt_rot_err_deg.
    # Diagnostic only — never feeds back into accept/reject.
    localization/gt_odom/enable: true
    localization/gt_odom/buffer_size: 200      # ring buffer depth (~2s @ 100Hz GT)
    localization/gt_odom/max_dt: 0.1           # seconds; reject lookups farther than this from scan stamp

    # RTK quality gate on gt_odom samples. All consumers, including initial
    # pose and recovery, require a finite positive covariance inside these
    # limits. The production source is the adapter's solution-type-gated
    # fixed-only stream; covariance is a second fail-closed check.
    #
    # The gate inspects msg->pose.covariance[0,7,14] (xx, yy, zz position
    # variances in m^2). A sample fails if any horizontal variance exceeds
    # max_pose_var_xy, OR vertical variance exceeds max_pose_var_z.
    #
    # Thresholds match adapter/config/adapter.yaml. Disable only for explicit
    # diagnostic replays; doing so permits degraded INS poses to alter state.
    localization/rtk_gate/enable: true
    localization/rtk_gate/max_pose_var_xy: 0.001
    localization/rtk_gate/max_pose_var_z: 0.005

    # GT-driven pose recovery: when GICP fails for `min_consecutive_failures`
    # scans in a row, snap current_pose / lidarPose / state.{p,q,v} to the
    # time-matched RTK-gated Atlas Duo sample so GICP can re-acquire from
    # a known-good state. The GT pose+twist is transformed from
    # msg->child_frame_id into base_frame via TF (cached on first GT
    # message). IMU biases are preserved. Setting enable=true forces
    # gt_odom/enable=true.
    #
    # IMPORTANT: use the adapter's /gps_p1/filtered_odom_rtk_fixed stream.
    # NavSatFix STATUS_GBAS_FIX is only RTK-class and cannot distinguish float
    # from fixed; solution type is the authoritative discriminator.
    localization/gt_recovery/enable: true
    # P2#3: raised 1 -> 5. With min=1 the snap fired on EVERY rejected frame
    # (1,860 snaps in run 12), masking dead-reckoning quality in all replay
    # metrics and hiding the stale-prev_vel bug. With the P1 partial-update
    # gating, long rejection streaks should no longer occur, so the snap is
    # back to what it was meant to be: a last-resort recovery after a
    # sustained losing streak (~0.5 s at 10 Hz), not a per-frame crutch.
    # Validation runs should ALSO do one pass with enable=false to expose the
    # true LiDAR+IMU behavior without RTK-fixed recovery.
    localization/gt_recovery/min_consecutive_failures: 5
    # Reject an otherwise plausible GICP basin when a fresh, time-matched
    # RTK_FIXED adapter pose proves it is farther away than this. Float/no-fix
    # provides no sample to this gate and therefore remains LiDAR+IMU only.
    # 0 disables the accepted-pose sanity check.
    localization/gt_recovery/sanity_radius: 10.0

    # --- Initial pose ---
    # If `localization/initial_pose/use` is true, seed the node with the
    # numeric pose below. The Atlas Duo INS bootstrap (use_odom_init=true)
    # is the recommended path; this static-pose path is for replays where
    # the operator has the GLIM trajectory's first-row pose in hand.
    # `frame: "lidar"` post-multiplies inv(T_base_lidar) automatically so
    # values can be pasted from GLIM's traj_lidar.txt directly. Use
    # `frame: "base_link"` if you already computed T_world_baselink yourself.
    localization/initial_pose/use: false
    localization/initial_pose/frame: "lidar"
    localization/initial_pose/x: 0.0
    localization/initial_pose/y: 0.0
    localization/initial_pose/z: 0.0
    localization/initial_pose/roll: 0.0
    localization/initial_pose/pitch: 0.0
    localization/initial_pose/yaw: 0.0

    # --- Preprocessing ---
    # Crop box keeps points within ±size m of the SENSOR origin. It runs in
    # the sensor frame BEFORE deskew/world transform (matches the code:
    # preprocessPoints crops original_scan ahead of deskewPointcloud), so it
    # is correct and useful with dlio/deskew=true — do NOT disable it for
    # deskew runs.
    #
    # Race-mode default: 40 m. At highway / race-track speed, anything
    # beyond ~40 m is too far ahead to matter for self-position — the
    # immediate-vicinity features dominate GICP correspondences anyway.
    # Tighter crop ≈ 30 % fewer points → faster GICP align.
    # Raise to 70.0 if running at urban / parking-lot speeds where
    # distant features genuinely contribute, or if your map is sparse
    # at the front-facing direction.
    dlio/preprocessing/cropBoxFilter/size: 40.0
    dlio/preprocessing/voxelFilter/use: true      # Recommended for full-map localization
    dlio/preprocessing/voxelFilter/res: 0.5       # 0.5 m voxel — matches GLIM_plusplus map resolution

    # Flip Y axis of incoming point cloud. Robin W in coordinate_mode:=3
    # already publishes REP-103 axes (X-forward / Y-left / Z-up), so leave
    # this at false. In three_lidar mode this runs AFTER merge.
    localization/flip_y: false

    # --- Raw LiDAR vertical-FOV quality gate ---
    # Robin W's nominal vertical FOV is 30 degrees. Measure each raw sensor
    # independently before crop/deskew/concatenation, using the robust
    # 0.5th-to-99.5th percentile elevation span. Rejecting below 27 degrees
    # prevents a narrow or partially populated stream from destabilizing SLAM;
    # one isolated outlier cannot make the cloud pass.
    localization/lidar_quality/min_vertical_fov_deg: 27.0
    localization/lidar_quality/min_valid_points: 100

    # --- LiDAR operating mode (front-only by default for race-mode latency) ---
    # front_only subscribes only to the primary front Robin W. three_lidar
    # subscribes to both rear Robin W streams and enables concatenation.
    # When three_lidar is selected, the node buffers each auxiliary topic,
    # scans, and on every primary scan finds the nearest aux scan in time,
    # transforms its XYZ into the primary sensor frame via TF (URDF), preserves
    # absolute per-point timestamps on the shared PTP axis, and appends the
    # bytes to the primary PointCloud2. Downstream sees a single cloud in the
    # primary frame with one coherent timebase.
    #
    # ⚡ Race-mode default: front_only.
    #   For self-position localization on a pre-built map, the front Robin W's
    #   120° FOV is sufficient — the map's prior + IMU integration already
    #   provide global context. Disabling concat:
    #     - removes ~50 ms of aux-buffering jitter
    #     - cuts the cloud GICP processes by roughly 3×
    #     - eliminates a TF-lookup failure mode if a rear LiDAR drops out
    #   At race speeds (40–80 m/s) you're moving toward the unmapped area;
    #   rear LiDARs would mostly re-observe geometry already in the map.
    #
    # 🛑 Select three_lidar if any of these apply:
    #   - The vehicle operates at slow / parking speeds where rear-quadrant
    #     features (e.g., a recently-passed landmark) materially help GICP.
    #   - The map has feature-sparse zones to the front and feature-rich zones
    #     to the rear (rare; happens in some outdoor industrial settings).
    #   - You're using gicp_localization for not-strictly-localization tasks
    #     (e.g., live obstacle accumulation) that need 360° coverage.
    #
    # The aux topic + frame lists below are retained so changing lidar_mode to
    # three_lidar picks them up unchanged. Mirror of GLIM_plusplus's
    # lidar_concat module: in three_lidar mode, the two pipelines consume the
    # same three Robin W streams and produce equivalent stitched clouds.
    localization/lidar_mode: "front_only"
    localization/lidar_concat/aux_topics: ["/robin_w_rear_left/points", "/robin_w_rear_right/points"]
    localization/lidar_concat/aux_frames: ["lidar_rear_left_link", "lidar_rear_right_link"]
    # Absolute point-time endpoint gate. Robin W sweeps are matched by
    # max(|min-min|, |max-max|); header time is only a tie-break.
    localization/lidar_concat/sweep_time_threshold: 0.01
    # Wait briefly for an aux callback that follows the primary callback.
    # One deadline is shared by all aux sensors, so this does not multiply by
    # the number of rear LiDARs.
    localization/lidar_concat/future_sweep_wait_timeout: 0.15
    localization/lidar_concat/buffer_size: 200      # per-aux ring depth (P4 parity: 20 = only ~2 s of aux history)

    # Robin W frame period in seconds. Robin W is rated 10-20 FPS; 0.100 is the
    # 10 FPS default and is deliberately the SAFE one (too large only loosens
    # the wire-contract bounds, it never falsely rejects a frame). This
    # component is documented to run at 20 Hz for race-mode latency -- see
    # ../recording/sensor_config.yaml -- so a 20 FPS deployment MUST set 0.05.
    # Leaving it at 0.100 there lets a fused double-frame pass the contract
    # check and raises the sweep_time_threshold ceiling to a full frame period.
    # The node warns if the observed frame period disagrees with this value.
    localization/seyond_frame_duration_s: 0.100

    # LiDAR sensor type for per-point timestamp handling during deskewing.
    # Options: ouster, velodyne, seyond, hesai, livox.
    # The pinned Seyond ROS 2 driver publishes `timestamp` as numeric FLOAT64
    # Unix seconds. The explicit seyond path validates that wire contract and
    # deskews directly on the absolute point times.
    localization/sensor_type: "seyond"

    # --- IMU and deskewing ---
    # Deskewing uses per-point timestamps to motion-compensate each scan
    # at IMU rate. Robin W keeps real per-point timestamps (unlike some
    # vendors that collapse them at the driver), so deskewing helps.
    dlio/deskew: true
    dlio/gravity: 9.81
    dlio/imu/bufferSize: 2000
    dlio/imu/calibTime: 0.5  # Seconds of stationary IMU data for bias/gravity
                             # calibration. Used ONLY when RTK init is unavailable;
                             # the rtk_init path below is preferred.

    # Motion-variance gate on the stationary calibration window.
    # If σ_||a|| over the calibTime window exceeds this (m/s²), the
    # stationary calibration is REFUSED — accumulating "stationary"
    # bias while the vehicle is actually moving produces a tilted
    # gravity vector and degraded scan matching for the first ~100
    # scans. On refusal, the window resets and re-accumulates; the
    # operator either brings the vehicle to rest or relies on the
    # rtk_init path above. 0.10 m/s² ≈ 10 mg jitter, generous for a
    # still Hitch dome. Set ≤ 0 to disable.
    localization/calib/motion_sigma_max: 0.10

    # --- RTK-driven IMU calibration ---
    # Uses the adapter fixed-only INS topic (gt_odom remap →
    # /gps_p1/filtered_odom_rtk_fixed) as the
    # truth source for bias estimation. Lets the vehicle calibrate while
    # moving and seeds pose+velocity from the first RTK-fixed sample
    # rather than assuming stationary. The adapter checks FusionEngine
    # solution type and covariance before publishing. If no fixed GT message
    # arrives within rtk_init/fallback_timeout
    # seconds of the first IMU sample, the node falls back to the
    # stationary `dlio/imu/calibTime` path above.

    # --- P4 (2026-07): strict merge guard + buffer parity. Concat
    # stays disabled in front_only mode; these keys govern three_lidar mode.
    localization/lidar_concat/require_all_aux: false     # false = localize on whatever LiDARs merged
    localization/lidar_concat/abort_on_merge_failure: true
    localization/lidar_concat/max_consecutive_aux_merge_failures: 10
    localization/lidar_concat/primary_frame: "lidar_front_link"  # URDF link of the primary Robin W
    localization/lidar_concat/urdf_path: ""              # set to sensor_dome.urdf for URDF-first extrinsics

    # --- Single-IMU hard guard (Hitch defaults).
    localization/imu/require_topic_allowlist: true
    localization/imu/topic_allowlist: ["/gps_p1/imu", "/imu/data"]
    # The adapter publishes imu_frame_id=imu_link; reject any accidental
    # second IMU with a different body frame.
    localization/imu/require_frame_match: true
    localization/rtk_init/enable: true
    localization/rtk_init/calib_window: 2.0      # seconds of IMU+GT residual accumulation
    localization/rtk_init/fallback_timeout: 5.0  # seconds without GT before stationary fallback

    # --- Geometric observer gains (proportional correction) ---
    odom/geo/Kp: 4.5      # Position correction gain
    odom/geo/Kv: 11.25    # Velocity correction gain
    odom/geo/Kq: 4.0      # Orientation correction gain
    # Online IMU bias adaptation is OFF (P3 unified-bias design): the Atlas
    # Duo's FusionEngine already outputs bias/scale-corrected IMU data, and
    # letting GICP residuals rewrite those biases fights the factory
    # calibration that rtk_init seeds into state.b. Keep at 0.0 — these keys
    # override the C++ defaults (also 0.0); raise only for a raw,
    # uncalibrated IMU source.
    odom/geo/Kab: 0.0     # Accelerometer bias correction gain (adaptation off)
    odom/geo/Kgb: 0.0     # Gyroscope bias correction gain (adaptation off)
    odom/geo/Kz_damping: 0.0
    odom/geo/abias_max: 5.0    # Max accelerometer bias (m/s^2)
    odom/geo/gbias_max: 0.5    # Max gyroscope bias (rad/s)

    # --- Yaw-rate-adaptive Kp / Kq attenuation (race-mode safety net) ---
    # During high yaw-rate transients (corner entries) GICP is more
    # likely to slide along an unconstrained axis. Simultaneously, the
    # IMU integration is at its most informative (gyro doing real
    # work). This block scales Kp and Kq down inside the geometric
    # observer's updateState() so the IMU prediction takes precedence
    # through the transient, then ramps back to full gains once the
    # vehicle is tracking straight again.
    #
    # Scale shape (|ω_z| = absolute body-frame yaw rate, rad/s):
    #   |ω_z| ≤ threshold_rad_s      → scale = 1.0          (no attenuation)
    #   |ω_z| ≥ saturation_rad_s     → scale = min_gain_scale
    #   in between                   → linear interpolation
    #
    # Defaults assume a race / track vehicle:
    #   threshold  = 0.5 rad/s ≈ 29°/s  (gentle lane change)
    #   saturation = 1.5 rad/s ≈ 86°/s  (aggressive corner entry)
    #   min_scale  = 0.25                (gains drop to 25% of nominal)
    #
    # Tune for your vehicle:
    #   - For a passenger car with no aggressive cornering, raise both
    #     thresholds (e.g., 1.0 / 3.0) so attenuation only fires on
    #     extreme inputs.
    #   - For an off-road / drifting vehicle that sees frequent high
    #     yaw rate, raise min_gain_scale (e.g., 0.5) so corrections
    #     never fully collapse.
    #   - Set enable=false to disable entirely and run the upstream
    #     fixed-gain observer.
    #
    # The observer logs a throttled INFO line ("yaw-rate attenuation
    # active") whenever scale < 0.99, so you can see the gate firing
    # in real-time during testing.
    odom/geo/yawrate_attenuation/enable: true
    odom/geo/yawrate_attenuation/threshold_rad_s: 0.5    # rad/s
    odom/geo/yawrate_attenuation/saturation_rad_s: 1.5   # rad/s
    odom/geo/yawrate_attenuation/min_gain_scale: 0.25    # floor on the multiplicative scale

    # --- Debug / visualization helpers ---
    localization/debug/enable_pub: true   # evidence-first default (P1/P4 debug topics)

    # --- P2/P3 (2026-07): observer stability + delta correction ---
    # P3 delta-form correction: apply GICP as the time-free delta
    # T_meas * inv(T_prior) to the CURRENT state instead of dragging it toward
    # the 0.1-0.3 s-stale absolute measurement (yaw-rate-proportional turn lag).
    # Complements (does not replace) the yaw-rate gain attenuation above.
    odom/geo/delta_correction: true
    # Observer forward-Euler stability: cap dt used for corrections (dt*K < 2).
    odom/geo/observer_dt_max: 0.15   # s
    odom/geo/max_pos_correction: 0.0 # m   — optional hard clamp (0 = off)
    odom/geo/max_vel_correction: 0.0 # m/s — optional hard clamp (0 = off)
    # Dead-reckoning covariance growth during GICP loss (time + distance based).
    odom/geo/dr_cov_time_rate: 0.5   # m of sigma per second of dead reckoning
    odom/geo/dr_cov_dist_frac: 0.05  # m of sigma per metre travelled
    localization/debug/enable_jump_log: false
    localization/debug/verbose_scan_log: true
    localization/debug/small_gicp_lm_debug: false  # Enable only for short controlled replays
    localization/debug/jump_trans_m: 30.0      # Base reject threshold if pose jumps > this (meters)
    localization/debug/jump_rot_deg: 30.0     # Base reject threshold if pose jumps > this (degrees)
    # Speed/scan_dt-aware jump-gate scaling (P2#2). The jump is GICP-vs-IMU-prior,
    # so legitimate disagreement scales with how far the prior could have drifted.
    # Effective thresholds:
    #   trans = jump_trans_m + trans_speed_scale * speed[m/s] * scan_dt[s]
    #   rot   = jump_rot_deg + rot_dt_scale_deg * scan_dt[s]
    # scan_dt is the time since the last accepted pose (grows during a failure
    # streak), so the gate loosens after a gap / at high speed to admit a valid
    # reacquisition, while staying tight for slow, short-gap scans. Set to 0 to
    # restore the fixed thresholds above.
    localization/jump/trans_speed_scale: 1.5   # extra metres of threshold per (speed*scan_dt) metre
    localization/jump/rot_dt_scale_deg: 60.0   # extra degrees of threshold per second of scan_dt

    # --- GICP registration ---
    # Race-mode default: 32 iterations.
    # On a pre-built map with feature-rich geometry GICP converges in 5–15
    # iterations typically; the upstream 128 default is a safety margin for
    # novel terrain. Cutting to 32 reduces per-scan compute ~3–4× without
    # changing convergence quality on well-mapped tracks. Raise back to 128
    # for noisier / sparser maps where convergence margin matters more
    # than scan-to-scan latency.
    gicp/maxIterations: 32
    gicp/correspondenceRandomness: 20
    gicp/maxCorrespondenceDistance: 4.0
    gicp/transformationEpsilon: 0.004
    gicp/rotationEpsilon: 0.004

    # Fitness retains the nano_gicp contract after the small_gicp migration:
    # mean squared Euclidean nearest-neighbor distance over ALL source points
    # (m^2), while the optimizer itself still uses small_gicp's Mahalanobis
    # energy. Good alignments on the full map hit ~0.01–0.05 m^2
    # (p90 0.04, p99 0.39).
    # Keep this at 1.0, not tighter: during the first ~4 scans the initial pose is still
    # settling, so fitness spikes to 1.2–1.4 on correct geometry; a 0.3 threshold rejects
    # those and the node gets stuck at initial pose with no GICP updates to recover from.
    gicp/fitnessRejectThreshold: 1.0   # Reject if all-point mean squared NN distance exceeds this
    gicp/minCorrespondenceRatio: 0.50  # Reject if too little scan mass has an in-radius GICP match
    gicp/rejectLargeJumps: true        # Hard-reject results that exceed the jump thresholds below

    # ========== P1 gating rework (docs/action_plan_turn_error_20260704.md) ==========
    # The run-12/13 cross-run replays showed the old binary gates failing in BOTH
    # directions: 1,804 hessian rejections (streaks up to 253 frames = ~25 s of
    # dead reckoning) whose discarded solutions were mostly fine (gt_err median
    # 1.57 m), AND 359 wrong-basin matches accepted with gt_err > 20 m. Root
    # cause: every threshold was an ABSOLUTE fitness value calibrated on a
    # same-run map (floor 0.03-0.06), while the cross-run map's fitness floor is
    # ~0.27 — so the fitness-conditioned branches were permanently true. The
    # rework has four pieces:
    #   1. fitnessBaseline — rolling median of ACCEPTED-frame fitness; gates use
    #      fitness_ratio = fitness / baseline (map-independent). Warm-up: gates
    #      stay absolute-only until minSamples accepted frames exist.
    #   2. fitnessRatioRejectThreshold — wrong-basin (bad-accept) gate. Run-12
    #      data: good accepts ratio median 1.00 / p99 1.92; bad accepts
    #      (gt_err>20 m) median 1.34 / p90 2.55. 2.0 rejects the clear outliers.
    #   3. degeneracy/partialUpdate — when hessianCondMax trips, PROJECT the
    #      correction onto well-constrained hessian eigen-directions (solution
    #      remapping, Zhang & Singh; the hessian is re-centered about the
    #      vehicle so its rotation block measures physical vehicle rotations,
    #      not lever-arm effects about the map origin) instead of rejecting the
    #      scan. Accepted-with-projection logs status=ok_partial;
    #      rejected_hessian remains only for the all-axes-degenerate case.
    #   4. yawGate — turn-aware consistency veto (Codex finding): T_prior
    #      already carries the IMU-integrated yaw across the scan gap, so a
    #      GICP yaw correction > maxCorrDeg on a low-confidence match
    #      (fitness_ratio > yawGate/fitnessRatio) keeps the IMU yaw instead.
    #      This is the wrong-basin ENTRY signature the jump gate can't see
    #      (bad accepts had jump medians of only 1.87 m / 1.38 deg).
    gicp/fitnessBaseline/enable: true
    gicp/fitnessBaseline/window: 201     # accepted-frame samples in the rolling median (~20 s @ 10 Hz)
    gicp/fitnessBaseline/minSamples: 50  # rolling median takes over after this many accepted frames
    # Warm-up seed (review fix): baseline used until minSamples accepted frames
    # exist, so the ratio gates and yaw veto are live from frame 1 — a replay
    # that starts mid-turn is otherwise unprotected during its most fragile
    # window. Set from the previous run's scorecard floor
    # (scripts/analyze_scan_debug_log.py; run-12 sparse cross-run map: 0.28).
    # RE-MEASURE after the dense-map rebuild. 0 = off (absolute-only warm-up).
    gicp/fitnessBaseline/seedBaseline: 0.0   # OFF until a Hitch-dome scorecard measures the per-map floor
    # (run scripts/analyze_scan_debug_log.py on a replay log, then set the floor here)
    gicp/fitnessRatioRejectThreshold: 2.0  # <=0 disables the wrong-basin ratio reject
    gicp/degeneracy/partialUpdate: true    # false = restore legacy binary hessian gate below
    # Full 6D coupled solution remapping (default). The re-centered hessian's
    # rotation coordinates are scaled by couplingLengthM (the typical
    # constraint lever arm, ~point-cloud radius after the 80 m crop) so rad
    # and m are commensurable, then ONE 6x6 eigendecomposition marks
    # degenerate directions — including COUPLED rot/trans null directions
    # (slide-along-a-wall = yaw + lateral mix) that the blockwise 3x3 analysis
    # (full6d: false, kept for A/B) structurally cannot see.
    gicp/degeneracy/full6d: true
    gicp/degeneracy/couplingLengthM: 20.0  # m; lever arm making rotation eigenvalues comparable to translation
    gicp/degeneracy/relFloor6d: 0.02       # full6d: eigen-axis degenerate if lambda < floor * lambda_max
    gicp/degeneracy/relFloorRot: 0.02      # blockwise only: rot eigen-axis floor
    gicp/degeneracy/relFloorTrans: 0.02    # blockwise only: trans eigen-axis floor
    # yawGate is INDEPENDENT of degeneracy/partialUpdate: the veto still fires
    # with the legacy binary hessian gate.
    gicp/yawGate/enable: true
    gicp/yawGate/maxCorrDeg: 1.5           # healthy GICP yaw corrections are <0.5 deg (IMU prior is good)
    gicp/yawGate/fitnessRatio: 1.2         # veto only on low-confidence matches

    # small_gicp ground-vehicle constraints. The migration default is 6dof so
    # the backend change preserves existing behavior. After a Robin W replay,
    # 4dof can fix roll/pitch to the IMU prior inside LM; 3dof also fixes yaw.
    gicp/dof/mode: "6dof"
    gicp/dof/full6dofEveryN: 0             # periodic unconstrained refresh; 0 disables
    gicp/prior/yawInfo: 0.0                # rad^-2; calibrate before enabling
    gicp/prior/rollPitchInfo: 0.0          # rad^-2; calibrate before enabling

    # Degeneracy TRIGGER (condition proxy of the raw 6x6 hessian). With
    # partialUpdate=true this no longer rejects — it decides when the
    # eigen-projection engages. 5e9 was calibrated on an earlier vehicle's data
    # (healthy corners 1-4e9; degenerate 6e9+); run 12 confirms the bulk of
    # corner frames sit just above it (hessian p90 6.9e9). Set <= 0 to disable.
    gicp/hessianCondMax: 5.0e9
    # LEGACY combined-gate thresholds — only consulted when
    # degeneracy/partialUpdate=false. These are ABSOLUTE values calibrated on
    # the same-run May 4 map; on cross-run maps they go stale (fitness floor
    # ~0.27 > 0.15 warn => gate collapses to "hessian alone" and mass-rejects
    # corners). Prefer the ratio-based gates above.
    gicp/hessianFitnessWarnThreshold: 0.15
    gicp/hessianTransWarnM: 1.0
    gicp/hessianRotWarnDeg: 1.5
