# =============================================================
# Hitch Sensor Dome — Recording Configuration
#
# Used by recording/sensor_recorder.py
#
# Topology (matches PTP_sync/README.md and config/sensor_dome_tf.yaml):
#   - 1× Point One Nav Atlas Duo (GNSS + IMU + pose, Ethernet-only TCP transport)
#   - 3× Seyond Robin W LiDARs (front 0°, rear-left 120°, rear-right 240°)
#   - 4× e-con RouteCAM_P_CU25_CXLC_IP67 (front stereo + rear pair)
# =============================================================

network:
  # NIC connected to the sensor switch. Override with --eth on the CLI.
  interface: "enp0s31f6"

# -------------------------------------------------------------
# Point One Nav Atlas Duo (GNSS / INS)
# Ethernet-only transport — the Atlas Duo hardware does not
# expose a BNC PPS pin or a USB serial NMEA stream. FusionEngine
# rides TCP 30201 to the deployment's native-message driver; NMEA
# rides TCP 30200 to gpsd (see PTP_sync/3_setup_ins_to_pc_sync.sh).
# -------------------------------------------------------------
point_one_nav:
  enabled: true
  tcp_ip: "192.168.1.30"     # Atlas Duo IP on RUTM50 LAN 4
  tcp_port: 30201            # FusionEngine TCP port
  # ROS topics recorded for the GNSS/INS path. The deployment's native-message
  # Atlas driver and adapter are external prerequisites: they must be running
  # before this recorder starts. The recorder verifies live adapter IMU and GNSS
  # output before it creates a bag.
  topics:
    native_imu: "/atlas/imu_calibrated" # sensor_msgs/Imu
    native_pose: "/atlas/pose_filtered" # fusion_engine_msgs/Pose
    adapter_fix: "/gps_p1/fix" # sensor_msgs/NavSatFix; adapter solution class/covariance
    rtk_fixed_odom: "/gps_p1/filtered_odom_rtk_fixed"  # nav_msgs/Odometry; kRtkFixed only
    adapter_imu: "/gps_p1/imu" # sensor_msgs/Imu; normalized Atlas stream
    local_enu_origin: "/gps_p1/local_enu_origin" # transient-local datum contract

# -------------------------------------------------------------
# Seyond Robin W LiDARs (3× directional)
# -------------------------------------------------------------
lidars:
  # Per-LiDAR UDP/TCP ports are set during multi-unit provisioning (see
  # PTP_sync/provision_robin_w_multiunit.sh). 8337/8338/8339 picked to
  # avoid Hadoop defaults (8020 NameNode / 8030 YARN) and the busy
  # 8000-8099 dev-server range. Match values to the PCS_ENV files in
  # PTP_sync/RobinW_FW2835_Multiunit/ — if you re-run provisioning with
  # different ports, update both here.
  # FPS NOTE: Robin W defaults to 10 FPS per Seyond's User Manual V2.2.
  # The datasheet rates the sensor at 10–20 FPS. For race-mode latency
  # (GICP_plusplus expects 20 Hz), configure 20 FPS via the LiDAR's
  # web UI (http://<lidar_ip>) → Sensor Config → frame rate, or via
  # innovusion_lidar_util. Setting persists across reboots.
  - name: "robin_w_front"
    ip: "192.168.1.10"
    port: 8337
    frame_id: "lidar_front_link"
    topic: "/robin_w_front/points"     # sensor_msgs/PointCloud2 @ 10–20 Hz (Robin W firmware)
  - name: "robin_w_rear_left"
    ip: "192.168.1.11"
    port: 8338
    frame_id: "lidar_rear_left_link"
    topic: "/robin_w_rear_left/points"
  - name: "robin_w_rear_right"
    ip: "192.168.1.12"
    port: 8339
    frame_id: "lidar_rear_right_link"
    topic: "/robin_w_rear_right/points"

# -------------------------------------------------------------
# Optional RouteCAM cameras (0–4× GigE Vision, IEEE 1588 PTP).
# Leave this list in place when cameras are temporarily absent: detection
# disables missing units and no profile requires them. It may also be [] on a
# permanently camera-free rig.
# -------------------------------------------------------------
cameras:
  - name: "cam_front_left"
    ip: "192.168.1.20"
    frame_id: "cam_front_left_link"
    topic: "/cam_front_left/image_raw"     # sensor_msgs/Image       @ 20 Hz
    info_topic: "/cam_front_left/camera_info"
  - name: "cam_front_right"
    ip: "192.168.1.21"
    frame_id: "cam_front_right_link"
    topic: "/cam_front_right/image_raw"
    info_topic: "/cam_front_right/camera_info"
  - name: "cam_rear_left"
    ip: "192.168.1.22"
    frame_id: "cam_rear_left_link"
    topic: "/cam_rear_left/image_raw"
    info_topic: "/cam_rear_left/camera_info"
  - name: "cam_rear_right"
    ip: "192.168.1.23"
    frame_id: "cam_rear_right_link"
    topic: "/cam_rear_right/image_raw"
    info_topic: "/cam_rear_right/camera_info"

# -------------------------------------------------------------
# Clock-sync tolerances
# (See PTP_sync/README.md §3 for expected accuracy at each stage.)
# -------------------------------------------------------------
sync:
  # Behavior when checks exceed tolerance. "hard" refuses to record.
  # "prompt" (warn + y/N) and "log" (continue) also exist, but are IGNORED
  # while requirements.clock_sync is true — synchronized clocks are a
  # precondition for both pipelines, not an operator judgement call.
  mode: "hard"

  # chrony — host clock vs. GPS NMEA discipline over Ethernet TCP.
  # Atlas Duo has no PPS pin, so accuracy is NMEA-bound (~10–100 ms).
  chrony_offset_ns: 100000000 # 100 ms — appropriate ceiling for NMEA-only sync
  chrony_max_age_s: 30        # last update must be within 30 s

  # Direct evidence from the ROS streams that will enter the bag. The recorder
  # launches every selected driver before preflight, then compares each
  # msg.header.stamp against host CLOCK_REALTIME at callback receipt. This age
  # includes sensor framing, transport, and driver latency, so it is not the
  # sub-50 us PTP servo offset. Gross epoch errors, nonmonotonic stamps, excess
  # latency variation, and drift are rejected independently for every sensor.
  sensor_timestamp:
    capture_window_s: 5.0
    min_samples: 10
    max_future_ms: 5.0
    max_drift_ms: 5.0
    lidar:
      # Robin W header.stamp is frame start, so a completed cloud naturally
      # arrives roughly one sweep later (50-100 ms at 20/10 FPS).
      max_age_ms: 250.0
      max_jitter_ms: 30.0
    camera:
      max_age_ms: 150.0
      max_jitter_ms: 30.0

  # Per-sensor overrides may be added beside topic/frame_id:
  # timestamp_max_age_ms, timestamp_max_jitter_ms, timestamp_max_drift_ms.

# -------------------------------------------------------------
# RTK-fix pre-flight check (matches GLIM++'s init gate)
# -------------------------------------------------------------
# GLIM++ requires the Atlas Duo to report RTK-fixed status with cm-grade
# covariance to start a mapping session — see GLIM_plusplus/README.md §6.
# This pre-flight subscribes to gnss_topic and fixed_odom_topic for
# capture_window_s. NavSatFix supplies the synchronized covariance check;
# only arrival on the adapter topic proves FusionEngine kRtkFixed.
rtk:
  # Behavior when the gate fails: "hard" refuses to start; "prompt" asks for
  # confirmation; "log" continues and records the result in metadata.
  # The selected requirements profile overrides this mode and the legacy
  # require_rtk_fixed value below. A strict profile cannot be downgraded.
  mode: "hard"

  # NavSatFix topic to inspect — same as GLIM++'s ins_fix_topic.
  gnss_topic: "/gps_p1/fix"

  # Authoritative stream emitted by adapter only for solution_type=kRtkFixed.
  fixed_odom_topic: "/gps_p1/filtered_odom_rtk_fixed"
  # Live normalized IMU evidence, required by every profile.
  imu_topic: "/gps_p1/imu"

  # Legacy/default value; the selected requirements profile overwrites it.
  # true requires both the Fixed-only stream and NavSatFix status >=
  # STATUS_GBAS_FIX. false skips both Fixed proofs even when rtk.mode is hard;
  # that mode can then gate only finite position and covariance quality.
  require_rtk_fixed: true

  # Maximum allowed σ on the NavSatFix position covariance (m). Default
  # matches GLIM++'s default ins_max_position_stddev — RTK-fixed reliably
  # hits 1–5 cm, so 0.10 m is a comfortable threshold.
  max_position_stddev: 0.10

  # Subscribe for this many seconds before deciding. Long enough to catch
  # a transient float-quality sample mid-window; short enough that a
  # locked rig isn't held up.
  capture_window_s: 5.0

# -------------------------------------------------------------
# Non-negotiable session requirements
#
# The recorder refuses to start unless every enabled requirement below is
# satisfied. These are NOT operator judgement calls: a session missing any of
# them looks identical to a good one on disk and only fails later, at map-build
# or localization time, when the data is no longer recapturable.
# -------------------------------------------------------------
requirements:
  # Point One Atlas Duo must be present and enabled. Its IMU feeds both
  # pipelines, so a bag without it is useless to either. Whether it must also
  # be RTK-FIXED is profile-dependent — see profiles below.
  gnss_imu: true
  # Read-only chrony and per-sensor timestamp verification must PASS, not
  # merely be reported. PTP_sync/ owns all clock configuration and discipline;
  # the recorder only observes the resulting state. Forces sync.mode = hard.
  clock_sync: true
  # Dual-antenna heading. Checked three ways when a profile requires it: the
  # secondary entry in config/sensor_dome_tf.yaml must be off its (0,0,0)
  # sentinel, commissioning must be explicitly attested below after observing
  # an RTK-fixed Atlas heading output, and Fixed-only odometry must carry a
  # finite, tight yaw sigma. The covariance checks live quality, not source.
  #
  # Like require_rtk_fixed, this is profile-dependent. GLIM++ needs drift-free
  # heading or the map accumulates the yaw error the second antenna exists to
  # prevent. GICP++ localizes against an already-built map from LiDAR + IMU and
  # does not, so a single-antenna rig can still collect useful GICP data.
  dual_antenna: true
  # Set true only after commissioning has directly observed Atlas
  # HeadingOutput/RawHeadingOutput with solution_type=RTKFixed and a baseline
  # matching sensor_dome_tf.yaml. Pose yaw covariance is checked at runtime for
  # quality, but cannot identify whether heading came from one or two antennas.
  dual_antenna_commissioned: false
  max_heading_stddev_rad: 0.05    # ~2.9 deg; a 1.0 m baseline gives ~0.01 rad
  tf_config_path: "../config/sensor_dome_tf.yaml"
  min_antenna_baseline_m: 0.05    # matches GLIM++'s dual-antenna sentinel test

  # Which LiDARs a session must carry, by intended consumer. Recording with
  # the front plus zero, one, or two rear units is a legitimate GICP++
  # data-collection run; the front unit remains mandatory because it is the
  # primary GICP stream. GLIM++ builds its offline map from all three.
  # Cameras are optional payloads and are never profile requirements.
  # Default is the lighter GICP profile: a bare `sensor_recorder.py` requires
  # the front Robin W, synchronized clocks, and live adapter IMU. Capturing a
  # GLIM++ map is a deliberate `--profile glim`, which then enforces three
  # LiDARs, RTK-fixed, and dual-antenna heading.
  profile: "gicp"
  profiles:
    # GLIM++ builds the offline map: it needs all three units, and it cannot
    # even initialize without a validated RTK-fixed solution (the map origin
    # must be globally referenced from the first factor).
    glim:
      lidars: ["robin_w_front", "robin_w_rear_left", "robin_w_rear_right"]
      require_rtk_fixed: true
      require_dual_antenna: true
    # GICP++ localizes against an already-built map using LiDAR + IMU, so a
    # session captured without an RTK fix is still useful. The Atlas Duo is
    # still mandatory — that is where the IMU comes from — but its GNSS
    # solution quality is not gating here.
    gicp:
      lidars: ["robin_w_front"]
      require_rtk_fixed: false
      require_dual_antenna: false

# -------------------------------------------------------------
# Recording options
# -------------------------------------------------------------
recording:
  # Output root. Resolved relative to this YAML's directory, so the
  # default path is <repo>/recording/data/. Override with --output or
  # an absolute path here (e.g. "/mnt/ssd/sessions") if you want to
  # store sessions on a faster / larger drive.
  output_dir: "data"
  session_name: "session_{ts}"

  # rosbag2 storage plugin. mcap is Foxglove-native and recommended.
  storage: "mcap"
  # Production recording is intentionally uncompressed to avoid compression
  # CPU load, write-path latency, and additional jitter during capture.
  compression_mode: "none" # the recorder rejects every other value

  # Auto-include /tf and /tf_static so all frames stitch in Foxglove.
  include_tf: true

  # Rate monitor publishes diagnostic_msgs/DiagnosticArray on this topic
  # which the Foxglove layout binds to a Diagnostics panel.
  rate_topic: "/sensor_dome/rates"
  rate_window_s: 2.0
  # Critical children must remain alive through this startup window.
  startup_grace_s: 2.0

# -------------------------------------------------------------
# Foxglove live visualization
# -------------------------------------------------------------
foxglove:
  enabled: true
  bridge_port: 8765
  layout_file: "foxglove/sensor_dome_layout.json"

# -------------------------------------------------------------
# ROS 2 driver launch commands (used to spawn driver nodes).
# Override per-installation. {arg} placeholders are substituted.
# -------------------------------------------------------------
drivers:
  seyond_lidar:
    # One driver instance per LiDAR. frame_id MUST match the
    # child_frame_id in config/sensor_dome_tf.yaml so Foxglove
    # can transform the cloud into imu_link. Parameter names are
    # taken from Seyond-Inc/seyond_ros_driver start.py.
    #
    # coordinate_mode:=3 selects REP-103 (X=fwd, Y=left, Z=up).
    # This is the driver's default but we pin it explicitly so the
    # static-TF rotations in sensor_dome_tf.yaml (yaw-only) remain
    # correct regardless of upstream driver-default changes.
    # Other modes (0..4) per Robin W Manual §4.2.5; 3 is the only
    # one compatible with the TF YAML in this repo.
    cmd: ["ros2", "launch", "seyond", "start.py",
          "lidar_name:={name}",
          "lidar_ip:={ip}",
          "port:={port}",
          "frame_id:={frame_id}",
          "frame_topic:={topic}",
          "coordinate_mode:=3"]
  routecam:
    # camera_aravis2 driver — one node per camera. PTP_sync/
    # 5_setup_camera_ptp.sh has already enabled and configured PTP on each
    # device. Do not pass PtpEnable/GevIEEE1588 here: recording verifies clock
    # state but must never mutate it.
    cmd: ["ros2", "run", "camera_aravis2", "camera_driver_gv",
          "--ros-args",
          "-r", "__ns:=/{name}",
          "-p", "guid:={ip}",
          "-p", "frame_id:={frame_id}",
          "-r", "image_raw:={topic}",
          "-r", "camera_info:={info_topic}"]
  static_tf:
    # Loads config/sensor_dome_tf.yaml via recording/launch/static_tf.launch.py.
    # ros2 launch accepts an absolute path to a launch file (no installed
    # ROS 2 package required).
    cmd: ["ros2", "launch", "{launch_file}", "tf_yaml:={tf_yaml}"]
  foxglove_bridge:
    cmd: ["ros2", "launch", "foxglove_bridge", "foxglove_bridge_launch.xml",
          "port:={port}"]
