# =============================================================
# Hitch Sensor Dome — Network Reference Design
#
# Single source of truth for system-dependent network parameters.
# All PTP_sync setup scripts read defaults from this file. Edit
# the values below for your installation; the scripts will pick
# them up automatically without --eth / --ips flags.
#
# CLI flags and environment variables still override these
# defaults at runtime (env > CLI > this YAML > built-in).
#
# Reference topology — two tiers (see PTP_sync/README.md §3.1):
#
#   ╔══ Tier 1 — LiDAR-only (no separate PoE switch) ════════╗
#   Internet → Teltonika RUTM50 (router, .1)
#       │  WAN port reconfigured as LAN (Network → LAN → "Use
#       │  WAN port as LAN") so all 5 RJ45 ports are LAN.
#       ├─ WAN-as-LAN port → Host PC (.5)
#       ├─ LAN 1 → Robin W front          (.10)
#       ├─ LAN 2 → Robin W rear-left      (.11)
#       ├─ LAN 3 → Robin W rear-right     (.12)
#       └─ LAN 4 → Atlas Duo Eth (NTRIP)  (.30)
#       LiDARs need 12 V DC (or a passive PoE injector) since
#       RUTM50 ports do not source PoE. PTP traverses the RUTM50
#       internal switch — expect ~5–50 µs LiDAR sync (no
#       boundary clock); still well inside LiDAR fusion needs.
#
#   ╔══ Tier 2 — adds 4× cameras (PoE++ + boundary clock) ═══╗
#   Tier 1 stays untouched; insert a Planet WGS-6325-8UP2X
#   downstream of the RUTM50 to host the 4× RouteCAM cameras.
#   Camera PTP rides the Planet's IEEE 1588 boundary clock for
#   1–10 µs accuracy. PC, INS, and LiDARs may migrate onto the
#   Planet switch at this point if you want every sensor on a
#   PTP-aware fabric.
# =============================================================

# ─── Network identity ──────────────────────────────────────
subnet:    "192.168.1.0/24"
gateway:   "192.168.1.1"        # RUTM50 router LAN IP
dns:       "192.168.1.1"        # router does DNS forwarding
broadcast: "192.168.1.255"

# ─── Host workstation (PTP grandmaster) ────────────────────
# Run `ip link show` to find your interface name. Common names:
#   enp0s31f6   onboard NIC (Lenovo ThinkPad P1 Gen 6, default)
#   eno1        legacy "predictable" name on many servers
#   eth0        kernel-style name (older Ubuntu, USB adapters)
#   enp1s0f0    PCIe NIC slot 1 port 0 (e.g. Intel X550-T2)
host:
  interface: "enp0s31f6"        # CHANGE THIS for your system
  ip:        "192.168.1.5"      # static, below RUTM50 DHCP pool
                                # (was .40 in pre-Tier-1 design)

# ─── Infrastructure ────────────────────────────────────────
router:
  model: "Teltonika RUTM50"     # or RUTM54 — same LAN behavior
  ip:    "192.168.1.1"
switch:
  model: "Planet WGS-6325-8UP2X"
  ip:    "192.168.1.2"          # management interface (optional)

# ─── Atlas Duo INS ─────────────────────────────────────────
# The Atlas Duo's only physical link to the host is Ethernet
# (its hardware does not expose a BNC PPS pin or USB serial
# data output). Everything flows through this one IP:
#   - NMEA 0183     TCP 30200  → gpsd → chrony → CLOCK_REALTIME
#   - FusionEngine  TCP 30201  → ros2-fusion-engine-driver
#   - NTRIP RTCM3   inbound from caster (RTK corrections)
#   - REST API      HTTP 80    config + monitoring
atlas_duo:
  ethernet_ip:   "192.168.1.30"
  nmea_tcp_port: 30200
  fe_tcp_port:   30201

# ─── Seyond Robin W LiDARs ─────────────────────────────────
# IPs are set on each unit via its web UI or innovusion_lidar_util.
lidars:
  - { name: "robin_w_front",      ip: "192.168.1.10" }
  - { name: "robin_w_rear_left",  ip: "192.168.1.11" }
  - { name: "robin_w_rear_right", ip: "192.168.1.12" }

# ─── e-con RouteCAM_P_CU25_CXLC_IP67 cameras ───────────────
# IPs are set via the Aravis web UI / arv-tool-0.8.
cameras:
  - { name: "cam_front_left",   ip: "192.168.1.20" }
  - { name: "cam_front_right",  ip: "192.168.1.21" }
  - { name: "cam_rear_left",    ip: "192.168.1.22" }
  - { name: "cam_rear_right",   ip: "192.168.1.23" }

# ─── DHCP pool (informational) ─────────────────────────────
# RUTM50 factory default — leave alone unless you're moving sensors
# above .100, in which case shrink this pool accordingly.
dhcp_pool:
  start: "192.168.1.100"
  end:   "192.168.1.249"
