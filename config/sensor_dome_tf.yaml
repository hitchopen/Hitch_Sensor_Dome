# =============================================================
# ROS2 Static TF Transforms — Sensor Dome v17c
#
# All transforms: parent (imu_link) -> child (sensor_link)
# Translation in meters, rotation as quaternion (x, y, z, w)
#
# Coordinate system: ROS REP 103
#   +X = Forward (front of vehicle)
#   +Y = Left
#   +Z = Up
#
# IMU frame (imu_link):
#   Origin at Point-One Atlas Duo Center of Navigation (CoN)
#   XY = (0, 0) — geometric center of hex plate
#   Z  = L1 plate top + atlas_con_z_from_mount_surface
#
# atlas_con_z_from_mount_surface: 18.5 mm
#   Verified from Pointonenav-assembly-atlas-duo.pdf side view drawing.
#   CoN is 18.5 mm above the bottom mounting surface of the Atlas Duo.
#
# Geometry source: sensor_dome.scad parameters
#   lidar_ring_radius:  90.0 mm
#   lidar_angles:       [0, 120, 240] deg
#   L2_z_bottom:        166.0 mm (LiDAR mount surface)
#   L2_z_top:           178.0 mm (camera mount surface)
#   rgb_cam_x:          105.0 mm (radial offset)
#   rgb_cam_y:           52.0 mm (lateral offset)
#   plate_thickness:      6.0 mm
#   atlas_con_z_from_mount_surface: 18.5 mm (verified from drawing)
#   CoN Z in SCAD coords: 24.5 mm
# =============================================================

# ----- Configuration -----
# To recalculate Z values for a different CoN height, adjust
# atlas_con_z_from_mount_surface and recompute:
#   lidar_z  = (166.0 - 6.0 - 18.5) / 1000 = 0.1415 m
#   camera_z = (178.0 - 6.0 - 18.5) / 1000 = 0.1535 m

# =============================================================
# LiDAR Transforms (lidar2imu)
#
# 3× Seyond Robin W1G, top-mounted on L2 underside at 120° intervals.
#
# LiDAR origin (from Seyond-Robin-W1G-Manual.pdf §2.4):
#   "The coordinate Origin is located at the center of the Cross
#    on top of the housing." This is the top mounting surface,
#   which sits against L2 bottom → z = L2_z_bottom in SCAD coords.
#
# Robin W1G native frame (§1.3 / §2.4): X=up, Y=right, Z=forward.
# The seyond_lidar_ros driver is configured to transform point cloud
# output to ROS REP 103 convention (X=fwd, Y=left, Z=up) at the
# driver level via config.yaml / launch file parameters.
#
# With driver-level transformation enabled, each lidar_link frame
# follows REP 103:
#   +X = scanning direction (radially outward),
#   +Y = left (tangential CCW), +Z = up.
# Rotation is yaw-only (rotation about Z by mounting angle).
# =============================================================

static_transforms:

  # =============================================================
  # Vehicle body frame: imu_link → base_link
  #
  # By default this is IDENTITY — base_link physically coincides
  # with imu_link (Atlas Duo Center of Navigation). All sensor
  # extrinsics below remain anchored to imu_link, so changing
  # the imu→base_link offset does NOT invalidate any other
  # transform or any previously built map.
  #
  # Why a separate base_link at all:
  #   - GLIM_plusplus builds the map in the imu_link frame (origin
  #     at the Atlas Duo CoN at session start). That's the natural
  #     mapping frame because the IMU drives the integration.
  #   - gicp_localization reports pose in base_link (ROS standard
  #     "robot body" frame). Most downstream consumers — controllers,
  #     planners, rviz robot models — expect pose in base_link.
  #   - The static imu_link → base_link transform here is the
  #     bridge between the two. Override the translation/rotation
  #     to put base_link wherever your vehicle convention says
  #     (chassis center, rear axle, etc) WITHOUT re-running
  #     mapping — the map stays valid because it's still
  #     anchored at imu_link.
  #
  # Examples for non-trivial vehicles:
  #   - base_link at vehicle's rear axle, 1.2 m behind the dome:
  #       translation: { x: -1.200, y: 0.000, z: -0.400 }
  #   - base_link at vehicle's geometric center, 0.6 m below dome:
  #       translation: { x: -0.400, y: 0.000, z: -0.600 }
  #
  # If the vehicle's body axis differs from the dome's axis (e.g.,
  # the dome is mounted yaw-rotated to fit the roof), include a
  # rotation here. Default identity assumes dome axes == body axes.
  - frame_id: "imu_link"
    child_frame_id: "base_link"
    translation:
      x:  0.000000
      y:  0.000000
      z:  0.000000
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.000000
      w:  1.000000

  # --- LiDAR: Front (Side 1, 0°) ---
  # Faces +X (forward). No rotation relative to IMU frame.
  - frame_id: "imu_link"
    child_frame_id: "lidar_front_link"
    translation:
      x:  0.090000
      y:  0.000000
      z:  0.141500
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.000000
      w:  1.000000

  # --- LiDAR: Rear-Left (Side 3, 120°) ---
  # Faces 120° from +X (rear-left).
  - frame_id: "imu_link"
    child_frame_id: "lidar_rear_left_link"
    translation:
      x: -0.045000
      y:  0.077942
      z:  0.141500
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.866025
      w:  0.500000

  # --- LiDAR: Rear-Right (Side 5, 240°) ---
  # Faces 240° from +X (rear-right).
  - frame_id: "imu_link"
    child_frame_id: "lidar_rear_right_link"
    translation:
      x: -0.045000
      y: -0.077942
      z:  0.141500
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.866025
      w: -0.500000

# =============================================================
# Camera Transforms (camera2imu)
#
# 4× RouteCAM_P_CU25_CXLC_IP67, bottom-mounted on L2 top surface.
# camera_link frame: +X = optical axis (radially outward),
#                    +Y = left, +Z = up.
# For camera_optical_frame (used by image_pipeline):
#   +Z = optical axis, +X = right, +Y = down.
#   Apply additional rotation from camera_link to optical_frame:
#     roll=-π/2, pitch=0, yaw=-π/2
#     quaternion: (x=-0.5, y=0.5, z=-0.5, w=0.5)
#
# Front stereo pair: both face +X (0°), baseline = 104.0 mm.
# Rear pair: symmetric about X axis (120° and 240°).
# =============================================================

  # --- Camera: Front-Right (0°, +Y offset) ---
  # Faces +X (forward), offset +52mm in Y (left).
  - frame_id: "imu_link"
    child_frame_id: "cam_front_right_link"
    translation:
      x:  0.105000
      y:  0.052000
      z:  0.153500
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.000000
      w:  1.000000

  # --- Camera: Front-Left (0°, -Y offset) ---
  # Faces +X (forward), offset -52mm in Y (right).
  - frame_id: "imu_link"
    child_frame_id: "cam_front_left_link"
    translation:
      x:  0.105000
      y: -0.052000
      z:  0.153500
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.000000
      w:  1.000000

  # --- Camera: Rear-Left (120°, +Y offset) ---
  # Faces 120° from +X. Global position: (-97.5, +64.9) mm.
  - frame_id: "imu_link"
    child_frame_id: "cam_rear_left_link"
    translation:
      x: -0.097533
      y:  0.064933
      z:  0.153500
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.866025
      w:  0.500000

  # --- Camera: Rear-Right (240°, -Y offset) ---
  # Faces 240° from +X. Global position: (-97.5, -64.9) mm.
  # Mirrors rear-left about X axis.
  - frame_id: "imu_link"
    child_frame_id: "cam_rear_right_link"
    translation:
      x: -0.097533
      y: -0.064933
      z:  0.153500
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.866025
      w: -0.500000

# =============================================================
# GNSS Antenna Transforms (gnss_antenna2imu)
#
# Two slots:
#   - gnss_antenna_primary_link    — the SP1 (or compatible) antenna on
#                                    the ArduSimple magnetic stand,
#                                    centered above the IMU. This is
#                                    where the Atlas Duo's primary GNSS
#                                    receiver gets its RF input. The
#                                    Atlas Duo internally compensates
#                                    for the lever arm to its CoN; this
#                                    TF is documentation + downstream
#                                    consumption (e.g. visualization).
#
#   - gnss_antenna_secondary_link  — OPTIONAL second antenna for
#                                    dual-antenna heading. Default
#                                    translation = (0, 0, 0), which
#                                    GLIM++ reads as "single-antenna
#                                    mode, do not enable dual-antenna
#                                    code paths". Set the translation to
#                                    the actual second-antenna position
#                                    (in the imu_link frame, metres) to
#                                    enable dual-antenna RTK heading.
#
# Why this matters for GLIM++:
#
#   With ONLY a primary antenna, the Atlas Duo has accurate position
#   from RTK but heading is derived from IMU integration (drifts over
#   time). GLIM++ uses the INS pose for init and never receives explicit
#   heading correction during the session.
#
#   With BOTH antennas, the Atlas Duo computes heading from the baseline
#   vector between them. RTK-fixed dual-antenna heading is typically
#   0.1°–0.3° accurate (depending on baseline length) — drift-free.
#   GLIM++ detects the configuration at startup and:
#     - tightens the init gate stability threshold (orientation locks
#       faster and more precisely with dual-antenna heading);
#     - shortens the init timeout;
#     - publishes tight yaw covariance on the factor bridge so any
#       downstream heading-aware factor can use it.
#
# Recommended baseline:
#   - Minimum ~0.5 m for usable heading accuracy
#   - 1.0–1.5 m typical for vehicle-roof installations
#   - Place antennas with clear sky view, away from metal masses that
#     could induce multipath asymmetry
# =============================================================

  # --- GNSS Antenna: Primary (centered above IMU on magnetic stand) ---
  # SP1 mounted on ArduSimple magnetic survey stand. Atlas Duo's primary
  # GNSS RF input. The Z value is the height above L2's top from the
  # combined stand height + antenna body — measure on your build and
  # update if it deviates from the nominal 0.300 m.
  - frame_id: "imu_link"
    child_frame_id: "gnss_antenna_primary_link"
    translation:
      x:  0.000000
      y:  0.000000
      z:  0.300000        # nominal stand + SP1 height; MEASURE & UPDATE
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.000000
      w:  1.000000

  # --- GNSS Antenna: Secondary (OPTIONAL — dual-antenna heading) ---
  # FILL IN the translation if you have a second antenna mounted. With
  # the default (0, 0, 0), GLIM++ runs in single-antenna mode and the
  # dual-antenna code paths stay disabled. Any non-zero translation
  # (norm > 0.05 m) flips GLIM++ to dual-antenna mode.
  #
  # Suggested locations (relative to imu_link, metres):
  #   - 1.0 m forward of primary  : x=+1.000, y=0.000, z=0.300
  #   - 1.0 m to the left of primary: x=0.000, y=+1.000, z=0.300
  #   - 0.7 m diagonal              : x=+0.500, y=+0.500, z=0.300
  #
  # The baseline DIRECTION (front-back vs left-right) determines which
  # axis the dual-antenna heading constrains. Front-back gives yaw;
  # left-right also gives yaw but with opposite sign convention. Match
  # the orientation Atlas Duo expects per your driver configuration.
  - frame_id: "imu_link"
    child_frame_id: "gnss_antenna_secondary_link"
    translation:
      x:  0.000000        # ← FILL IN to enable dual-antenna mode
      y:  0.000000        # ← FILL IN to enable dual-antenna mode
      z:  0.000000        # ← FILL IN to enable dual-antenna mode
    rotation:
      x:  0.000000
      y:  0.000000
      z:  0.000000
      w:  1.000000

# =============================================================
# Summary Table
#
# Sensor                       X (m)     Y (m)     Z (m)    Yaw (°)
# -------------------------  --------  --------  --------  --------
# base_link                   0.0000    0.0000    0.0000      0   (identity — override per vehicle)
# lidar_front                 0.0900    0.0000    0.1415      0
# lidar_rear_left            -0.0450    0.0779    0.1415    120
# lidar_rear_right           -0.0450   -0.0779    0.1415    240
# cam_front_right             0.1050    0.0520    0.1535      0
# cam_front_left              0.1050   -0.0520    0.1535      0
# cam_rear_left              -0.0975    0.0649    0.1535    120
# cam_rear_right             -0.0975   -0.0649    0.1535    240
# gnss_antenna_primary        0.0000    0.0000    0.3000      0
# gnss_antenna_secondary       (FILL IN — dual antenna)        —
#
# All roll = 0, pitch = 0.
# Front stereo baseline: 0.1040 m (104 mm).
# Rear pair symmetric about X axis.
# Dual GNSS antenna: enabled when secondary translation norm > 0.05 m.
# =============================================================

